<style>
:root {
  --premium: #6754c7;
  --texto: #303052;
}

html,
body {
  margin: 0;
  height: 100%;
  height: 100dvh;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: #faf7ff;
}

.screen {
  height: 100%;
  height: 100dvh;
}

button {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

button:active {
  transform: scale(.96);
}

button:focus-visible {
  outline: 3px solid #edaa36;
  outline-offset: 3px;
}

#home {
  background: radial-gradient(
    ellipse at top,
    #e5d9fc,
    #fffcf6
  );
}

.startButton,
.topBtn,
.menuBack {
  background: var(--premium);
  border-radius: 15px;
  min-height: 44px;
  box-shadow: none;
}

#menu {
  background: #f6f2fc;
}

.menuPage {
  background: transparent !important;
  box-shadow: none !important;
}

.menuHead {
  background: #f6f2fc !important;
}

.menuHead h1,
.storyTitle {
  color: var(--texto);
}

.storyCard {
  background: white;
  border: 1px solid #e4ddec;
  border-radius: 20px;
  padding: 10px;
  box-shadow: 0 6px 20px #49366c12;
}

.storyCard:hover {
  border-color: var(--premium);
}

#editor {
  background: #f4f0fa;
  overflow: hidden;
}

.editorTop {
  gap: 8px;
  background: #ffffffcc;
  border-bottom: 1px solid #e8e0f1;
}

.titleBar {
  color: var(--texto);
  font-size: 18px;
}

.titleBar .verse {
  color: #827993;
  font-size: 12px;
}

.palette {
  width: 128px;
  padding: 10px;
  gap: 10px;
  border: 1px solid #e6dff1;
  box-shadow: none;
}

.tool {
  width: 96px;
  min-height: 46px;
  border: 1px solid #e7e1ef;
  border-radius: 14px;
  background: #faf8fd;
  color: #605572;
}

.tool.active {
  background: #eee8ff;
  border-color: #8e79df;
  box-shadow: 0 0 0 2px #dcd1ff;
}

.color {
  width: 40px;
  height: 40px;
  border: 3px solid white;
  box-shadow: 0 2px 6px #39304720;
}

.canvasWrap {
  min-height: 0;
  border: 1px solid #e3dbea;
  border-radius: 16px;
  box-shadow: 0 8px 32px #4433660c;
}

#paintCanvas {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  touch-action: none;
}

.sideNav {
  width: 48px;
}

.navBtn {
  width: 48px;
  height: 48px;
  background: white;
  color: var(--premium);
  font-size: 28px;
  border: 1px solid #e4ddec;
  box-shadow: none;
}

/* Celular: desenho acima, ferramentas abaixo */
@media (max-width: 700px) {
  #menu .menuPage {
    width: 100%;
    margin: 0;
    padding: 14px;
  }

  .editorTop {
    height: auto;
    min-height: 60px;
    padding: 6px 8px;
    padding-top: max(6px, env(safe-area-inset-top));
    gap: 6px;
  }

  .topBtn {
    min-height: 44px;
    padding: 8px;
    font-size: 11px;
  }

  .titleBar {
    flex: 1;
    min-width: 0;
    font-size: 13px;
  }

  .titleBar .verse {
    font-size: 10px;
  }

  .editorBody {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) auto;
    width: 100%;
    min-height: 0;
    padding: 5px;
    padding-bottom: max(5px, env(safe-area-inset-bottom));
    gap: 6px;
  }

  .canvasWrap {
    grid-column: 1;
    grid-row: 1;
    width: 100%;
    min-width: 0;
    min-height: 0;
    border-radius: 12px;
  }

  .palette {
    grid-column: 1;
    grid-row: 2;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    width: 100%;
    padding: 8px;
    gap: 6px;
    border-radius: 16px;
    overflow: visible;
  }

  .colors {
    grid-column: 1 / -1;
    grid-row: 1;
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 4px 3px 8px;
  }

  .color {
    flex: 0 0 40px;
    width: 40px;
    height: 40px;
  }

  .tool {
    width: 100%;
    min-height: 44px;
    padding: 4px;
    font-size: 11px;
    border-radius: 11px;
  }

  #bucketBtn {
    grid-column: 1;
    grid-row: 2;
  }

  #eraserBtn {
    grid-column: 2;
    grid-row: 2;
  }

  #undoBtn {
    grid-column: 3;
    grid-row: 2;
  }

  #redoBtn {
    grid-column: 4;
    grid-row: 2;
  }

  .sideNav {
    position: absolute;
    top: 12px;
    right: 12px;
    flex-direction: row;
    width: auto;
    gap: 5px;
  }

  .navBtn {
    width: 36px;
    height: 36px;
    font-size: 24px;
    background: #fffffff0;
  }
}
</style>
